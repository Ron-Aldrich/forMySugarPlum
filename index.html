<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="updates.css">
</head>
<body>

<div class="intro" id="intro">
  <h2 id="introTitle"></h2>
  <p id="introNote"></p>
  <button id="begin" type="button"></button>
</div>
<button class="music" id="musicBtn" type="button" aria-label="Music on or off">&#9835;</button>
<audio id="bgm" loop preload="auto"></audio>

<section class="hero">
  <h1 id="title"></h1>
  <p id="subtitle"></p>
  <span class="down" aria-hidden="true"></span>
</section>

<main id="memories"></main>

<section class="gallery" id="gallerySection">
  <h2 id="galleryTitle"></h2>
  <p class="gsub" id="gallerySub"></p>
  <div class="ggrid" id="gallery"></div>
</section>

<div class="lightbox" id="lightbox" aria-hidden="true">
  <button class="lb-close" id="lbClose" type="button" aria-label="Close">&times;</button>
  <button class="lb-nav lb-prev" id="lbPrev" type="button" aria-label="Previous">&#8249;</button>
  <figure>
    <img id="lbImg" alt="">
    <figcaption id="lbCap"></figcaption>
  </figure>
  <button class="lb-nav lb-next" id="lbNext" type="button" aria-label="Next">&#8250;</button>
</div>

<section class="videos" id="videosSection">
  <h2 id="videosTitle"></h2>
  <div class="vgrid" id="videos"></div>
</section>

<section class="letter">
  <div class="page">
    <h2 id="letterTitle"></h2>
    <div id="letterBody"></div>
    <p class="sign" id="letterSign"></p>
  </div>
</section>

<section class="end"><p id="ending"></p></section>

<a class="fab" id="updFab" href="updates.html" aria-label="Open daily notes">
  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
  <span>Little update ni Ronacles </span>
</a>

<script src="config.js"></script>
<script src="heic.js"></script>
<script src="script.js"></script>
<script>
  // tapping "Little update ni Ronacles" tells the updates pages to play the song from the start
  document.getElementById('updFab').addEventListener('click', function () {
    try { sessionStorage.setItem('updMusicOn', '1'); sessionStorage.setItem('updMusicTime', '0'); } catch (e) {}
  });
</script>
</body>
</html>
